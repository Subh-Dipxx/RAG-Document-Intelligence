services:
  postgres:
    build: ./postgres
    image: postgres:16-pgvector
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${POSTGRES_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB} -p 5432"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-h", "127.0.0.1", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":${MINIO_BROWSER_PORT}"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${MINIO_PORT}:9000"
      - "${MINIO_BROWSER_PORT}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "${QDRANT_PORT}:6333"
    volumes:
      - qdrant_storage:/qdrant/storage

  opensearch:
    image: opensearchproject/opensearch:2.9.0
    environment:
      - discovery.type=single-node
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - "plugins.security.disabled=true"
      - cluster.name=opensearch
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    ports:
      - "${OPENSEARCH_PORT}:9200"
      - "${OPENSEARCH_MONITORING_PORT}:9600"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    ports:
      - "${OLLAMA_PORT}:11434"
    volumes:
      - ollama_data:/var/lib/ollama

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    env_file:
      - .env
    environment: &app_env
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
      REDIS_URL: "redis://redis:6379/0"
      MINIO_ENDPOINT: "${MINIO_ENDPOINT}"
      MINIO_ROOT_USER: "${MINIO_ROOT_USER}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD}"
      MINIO_BUCKET_RAW_DOCUMENTS: "${MINIO_BUCKET_RAW_DOCUMENTS}"
      MINIO_BUCKET_PAGE_IMAGES: "${MINIO_BUCKET_PAGE_IMAGES}"
      MINIO_BUCKET_OCR_OUTPUT: "${MINIO_BUCKET_OCR_OUTPUT}"
      MINIO_BUCKET_TABLES: "${MINIO_BUCKET_TABLES}"
      MINIO_BUCKET_THUMBNAILS: "${MINIO_BUCKET_THUMBNAILS}"
      MINIO_PRESIGN_EXPIRES_SECONDS: "${MINIO_PRESIGN_EXPIRES_SECONDS}"
      OBJECT_STORAGE_BACKEND: "${OBJECT_STORAGE_BACKEND}"
      QDRANT_URL: "${QDRANT_URL}"
      OPENSEARCH_URL: "${OPENSEARCH_URL}"
      OLLAMA_URL: "${OLLAMA_URL}"
    ports:
      - "${API_PORT}:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/health || exit 1"]
      interval: 10s
      timeout: 15s
      retries: 5

  worker:
    build:
      context: .
      dockerfile: api/Dockerfile
    command: ["celery", "-A", "workers.celery_app:celery_app", "worker", "--loglevel=info", "--queues=default,document_tasks,dead_letter"]
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    env_file:
      - .env  
    environment: *app_env

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT}:80"


volumes:
  postgres_data:
  redis_data:
  minio_data:
  qdrant_storage:
  opensearch_data:
  ollama_data:

networks:
  default:
    name: rag_default