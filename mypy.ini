[mypy]
python_version = 3.11
ignore_missing_imports = True
warn_unused_configs = True
# Conservative defaults; enable stricter checks per-package below
strict = False

[mypy-domain.*]
strict = True

[mypy-ingestion.*]
strict = True

[mypy-chunking.*]
strict = True

[mypy-indexing.*]
strict = True

[mypy-retrieval.*]
strict = True

[mypy-generation.*]
strict = True
